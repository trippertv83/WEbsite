<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anfrage</title>
    <style>
      :root {
        --blue: #1E5D8B;
        --blue-dark: #1E5D8B;
        --blue-soft: #E8EEF3;
        --text: #2a3038;
        --soft: #5b6573;
        --heading: #1c222b;
        --line: #d5dbe3;
        --card: #fff;
        --bg: #f3f4f6;
        --error: #b42318;
        --ok: #1f7a4d;
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 800px;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        color: var(--heading);
        font-size: 1.55rem;
      }
      .lead { color: var(--soft); margin: 0 0 1.2rem; }
      form, .done {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 1.2rem;
        box-shadow: 0 8px 24px rgba(28, 34, 43, 0.08);
      }
      label {
        display: block;
        font-weight: 650;
        margin: 0.85rem 0 0.3rem;
      }
      input, textarea, select {
        width: 100%;
        font: inherit;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }
      textarea { min-height: 90px; resize: vertical; }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
      .hint { color: var(--soft); font-size: 0.88rem; font-weight: 400; }
      button {
        margin-top: 1.2rem;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--blue-dark); }
      button:disabled { opacity: 0.65; cursor: wait; }
      .msg { margin-top: 0.8rem; }
      .msg.err { color: var(--error); }
      .msg.ok { color: var(--ok); }
      .done { display: none; }
      .done.is-on { display: block; }
      form.is-off { display: none; }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 12px;
        margin: 1rem 0;
        padding: 0.75rem 1rem 1rem;
      }
      legend { font-weight: 700; color: var(--heading); padding: 0 0.35rem; }
      .check {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        font-weight: 500;
        margin: 0.45rem 0;
      }
      .check input { width: auto; margin-top: 0.2rem; }
      .yesno { display: flex; gap: 1rem; }
      .steps { font-weight: 700; color: var(--blue); margin: 0 0 0.8rem; }
      .doc-preview {
        max-height: 420px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        background: #fafbfc;
        margin: 0.75rem 0;
      }
      .legal-doc h2 { margin-top: 0; font-size: 1.15rem; }
      .legal-doc h3 { font-size: 1rem; }
      .sign-wrap canvas {
        display: block;
        width: 100%;
        max-width: 640px;
        height: 180px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: #fff;
        touch-action: none;
      }
      .sign-img { display: block; max-width: 280px; height: auto; background: #fff; }
      button.ghost {
        background: #fff;
        color: var(--blue);
        border: 1px solid var(--blue);
        margin-top: 0.5rem;
        width: auto;
        padding: 0.4rem 0.8rem;
        min-height: 40px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="titel">Anfrage</h1>
      <p class="lead" id="lead"></p>
      <form id="form">
        <div class="row">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" required autocomplete="name" />
          </div>
          <div>
            <label for="email">E-Mail</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
        </div>
        <div class="row">
          <div>
            <label for="phone">Telefon</label>
            <input id="phone" name="phone" autocomplete="tel" />
          </div>
          <div>
            <label for="ort">Ort / PLZ</label>
            <input id="ort" name="ort" />
          </div>
        </div>
        <label for="adresse">Objektadresse</label>
        <input id="adresse" name="adresse" />
        <div id="bogen"></div>
        <label for="nachricht">Nachricht</label>
        <textarea id="nachricht" name="nachricht" placeholder="Kurz das Vorhaben beschreiben"></textarea>
        <div id="uploads"></div>
        <p class="hint">PDF, JPG oder PNG, max. 4 MB je Datei. Die Unterlagen gehen direkt per E-Mail an uns.</p>
        <button type="submit" id="send">Anfrage senden</button>
        <p class="msg" id="msg"></p>
      </form>
      <div class="done" id="done">
        <p>Vielen Dank. Ihre Anfrage und die hochgeladenen Unterlagen wurden an uns gesendet. Wir melden uns.</p>
      </div>
    </main>
    <script type="module">
      import { serviceById, API_BASE } from './assets/js/services.js';
      import { loadSession, clearSession } from './assets/js/session.js';
      import { startIsfpAnfrage } from './assets/js/isfp-anfrage.js';

      const session = loadSession();
      if (!session || !session.token) {
        const next = encodeURIComponent(location.pathname + location.search);
        location.replace('kunde.html?next=' + next);
      } else {

      const id = new URLSearchParams(location.search).get('id');
      const service = serviceById(id);
      const form = document.getElementById('form');
      const msg = document.getElementById('msg');

      function val(idName) {
        const el = document.getElementById(idName);
        return el ? String(el.value || '').trim() : '';
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const text = String(reader.result || '');
            const comma = text.indexOf(',');
            resolve(comma >= 0 ? text.slice(comma + 1) : text);
          };
          reader.onerror = () => reject(new Error('Datei konnte nicht gelesen werden.'));
          reader.readAsDataURL(file);
        });
      }

      async function postJson(path, payload) {
        const res = await fetch(API_BASE + '/' + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const text = await res.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
        if (!res.ok) {
          if (res.status === 401) {
            clearSession();
            throw new Error('Bitte zuerst als Kunde anmelden.');
          }
          throw new Error(data.error || 'Serverfehler ' + res.status);
        }
        return data;
      }

      if (!service || service.cta !== 'form') {
        document.getElementById('titel').textContent = 'Leistung nicht gefunden';
        form.innerHTML =
          '<p>Bitte gehen Sie zurück zur Übersicht und wählen Sie eine Leistung.</p>';
      } else if (service.id === 'isfp') {
        document.title = 'Anfrage: ' + service.titel;
        startIsfpAnfrage({
          session,
          service,
          form,
          doneEl: document.getElementById('done'),
          postJson,
          fileToBase64,
        });
      } else {
        document.title = 'Anfrage: ' + service.titel;
        document.getElementById('titel').textContent = service.titel;
        document.getElementById('lead').textContent =
          (service.bedarfTitel || 'Bitte Angaben und Unterlagen senden.') +
          (service.preis ? '  ·  ' + service.preis : '');
        if (session) {
          const nameEl = document.getElementById('name');
          const emailEl = document.getElementById('email');
          const phoneEl = document.getElementById('phone');
          const ortEl = document.getElementById('ort');
          const adresseEl = document.getElementById('adresse');
          if (nameEl && session.name) nameEl.value = session.name;
          if (emailEl && session.email) emailEl.value = session.email;
          if (phoneEl && session.phone) phoneEl.value = session.phone;
          if (ortEl && (session.plz || session.ort)) {
            ortEl.value = [session.plz, session.ort].filter(Boolean).join(' ');
          }
          if (adresseEl && (session.strasse || session.hausnummer)) {
            adresseEl.value = [session.strasse, session.hausnummer].filter(Boolean).join(' ');
          }
        }

        const bogen = document.getElementById('bogen');
        if (service.bogen) {
          bogen.innerHTML =
            '<div class="row"><div><label for="gebaeudetyp">Gebäudetyp</label>' +
            '<select id="gebaeudetyp"><option value="">Bitte wählen</option>' +
            '<option>Einfamilienhaus</option><option>Zweifamilienhaus</option>' +
            '<option>Mehrfamilienhaus</option><option>Nichtwohngebäude</option>' +
            '<option>Denkmal</option></select></div>' +
            '<div><label for="baujahr">Baujahr</label><input id="baujahr" inputmode="numeric"></div></div>' +
            '<div class="row"><div><label for="wohnflaeche">Wohn- / Nutzfläche in m²</label>' +
            '<input id="wohnflaeche" inputmode="decimal"></div>' +
            '<div><label for="heizung">Heizung / Energieträger</label><input id="heizung"></div></div>';
        }

        document.getElementById('uploads').innerHTML = (service.uploads || [])
          .map((item) => {
            return (
              '<label for="file-' +
              item.key +
              '">' +
              item.label +
              ' <span class="hint">(Datei)</span></label>' +
              '<input id="file-' +
              item.key +
              '" type="file" accept=".pdf,.jpg,.jpeg,.png,.zip" data-key="' +
              item.key +
              '" data-label="' +
              item.label +
              '" />'
            );
          })
          .join('');
      }

      if (service && service.cta === 'form' && service.id !== 'isfp') {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!service) return;
        msg.className = 'msg';
        msg.textContent = 'Wird gesendet …';
        const button = document.getElementById('send');
        button.disabled = true;
        try {
          const files = [];
          const inputs = [...document.querySelectorAll('input[type=file]')];
          for (const input of inputs) {
            const file = input.files && input.files[0];
            if (!file) continue;
            if (file.size > 4 * 1024 * 1024) {
              throw new Error(file.name + ' ist größer als 4 MB.');
            }
            const uploaded = await postJson('inquiryFile', {
              sessionToken: session.token,
              name: file.name,
              mimeType: file.type || 'application/octet-stream',
              category: input.dataset.key,
              contentBase64: await fileToBase64(file),
            });
            files.push({
              name: file.name,
              label: input.dataset.label,
              url: uploaded.downloadUrl || uploaded.fileUrl,
            });
          }

          await postJson('serviceInquiry', {
            sessionToken: session.token,
            serviceId: service.id,
            titel: service.titel,
            preis: service.preis || '',
            contact: {
              name: val('name'),
              email: val('email'),
              phone: val('phone'),
              ort: val('ort'),
              adresse: val('adresse'),
            },
            answers: {
              gebaeudetyp: val('gebaeudetyp'),
              baujahr: val('baujahr'),
              wohnflaeche: val('wohnflaeche'),
              heizung: val('heizung'),
              nachricht: val('nachricht'),
            },
            files,
          });

          form.classList.add('is-off');
          document.getElementById('done').classList.add('is-on');
          msg.textContent = '';
        } catch (error) {
          msg.className = 'msg err';
          msg.textContent =
            error.message ||
            'Senden fehlgeschlagen. Bitte Wix-Site veröffentlichen und später erneut versuchen.';
        } finally {
          button.disabled = false;
        }
      });
      }
      }
    </script>
  </body>
</html>
