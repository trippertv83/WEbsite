<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leistungen</title>
    <style>
      :root {
        --blue: #1E5D8B;
        --blue-dark: #1E5D8B;
        --blue-soft: #E8EEF3;
        --text: #2a3038;
        --soft: #5b6573;
        --heading: #1c222b;
        --line: #d5dbe3;
        --card: #fff;
        --bg: transparent;
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        font-family: var(--font);
        color: var(--text);
        background: var(--bg);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.1rem;
      }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(28, 34, 43, 0.08);
        padding: 1.05rem 1.05rem 1.15rem;
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      .top {
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
        margin-bottom: 0.85rem;
      }
      .icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--blue);
        color: #fff;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .icon svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.8; }
      h3 {
        margin: 0;
        font-size: 1.02rem;
        line-height: 1.25;
        color: var(--heading);
      }
      .sub {
        margin: 0.15rem 0 0;
        color: var(--soft);
        font-size: 0.86rem;
      }
      .photo {
        width: 100%;
        height: 148px;
        object-fit: cover;
        border-radius: 10px;
        background: var(--blue-soft);
        display: block;
      }
      .need {
        margin: 0.9rem 0 0;
        padding: 0;
        list-style: none;
        flex: 1;
      }
      .need li {
        position: relative;
        padding: 0.22rem 0 0.22rem 1.35rem;
        font-size: 0.9rem;
        line-height: 1.35;
      }
      .need li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0.45rem;
        width: 0.7rem;
        height: 0.7rem;
        background: var(--blue);
        border-radius: 2px;
        clip-path: polygon(14% 44%, 0 58%, 38% 100%, 100% 18%, 84% 4%, 38% 68%);
      }
      .price {
        margin: 0.85rem 0 0.7rem;
        text-align: center;
        color: var(--blue);
        font-size: 1.55rem;
        font-weight: 800;
      }
      .price:empty { display: none; }
      .btn {
        display: block;
        text-align: center;
        text-decoration: none;
        font-weight: 700;
        min-height: 44px;
        line-height: 44px;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
      }
      .btn:hover { background: var(--blue-dark); }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { SERVICES, ANFRAGE_URL, WIZARD_URL, PHONE_TEL } from './assets/js/services.js';

      let items = SERVICES;

      function iconSvg(name) {
        const paths = {
          plan: '<path d="M7 4h10v16H7z"/><path d="M10 8h4M10 12h4M10 16h2"/>',
          house: '<path d="M4 12l8-7 8 7"/><path d="M7 11v9h10v-9"/>',
          cert: '<path d="M8 4h8v12H8z"/><path d="M10 8h4M10 11h3"/><circle cx="14" cy="17" r="2"/>',
          form: '<path d="M7 4h10v16H7z"/><path d="M10 8h5M10 12h5M10 16h3"/>',
          heat: '<path d="M12 4c0 6-6 6-6 12a6 6 0 0012 0c0-6-6-6-6-12z"/>',
          meter: '<circle cx="12" cy="12" r="8"/><path d="M12 12l4-3"/>',
          leaf: '<path d="M6 16c8-1 12-8 12-12-8 0-12 6-12 12z"/><path d="M8 14c3-2 5-5 6-8"/>',
          camera: '<path d="M4 9h4l2-2h4l2 2h4v10H4z"/><circle cx="12" cy="14" r="3"/>',
          sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M5 19l1.5-1.5"/>',
          bridge: '<path d="M4 16h16M6 16V9h12v7"/><path d="M8 16v-4h8v4"/>',
          door: '<path d="M7 20V5h10v15"/><path d="M14 12h1"/>',
        };
        return '<svg viewBox="0 0 24 24">' + (paths[name] || paths.house) + '</svg>';
      }

      function picture(kind) {
        const colors = {
          plans: ['#E8EEF3', '#1E5D8B'],
          house: ['#E8EEF3', '#1E5D8B'],
          docs: ['#E8EEF3', '#1E5D8B'],
          heat: ['#E8EEF3', '#1E5D8B'],
          camera: ['#E8EEF3', '#1E5D8B'],
          sun: ['#E8EEF3', '#1E5D8B'],
          door: ['#E8EEF3', '#1E5D8B'],
        };
        const [a, b] = colors[kind] || colors.house;
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">' +
          '<rect width="640" height="360" fill="' + a + '"/>' +
          '<rect x="48" y="70" width="250" height="220" rx="10" fill="#fff"/>' +
          '<rect x="78" y="100" width="190" height="10" fill="' + b + '" opacity=".4"/>' +
          '<rect x="78" y="128" width="150" height="8" fill="' + b + '" opacity=".22"/>' +
          '<rect x="78" y="152" width="170" height="8" fill="' + b + '" opacity=".22"/>' +
          '<rect x="78" y="176" width="130" height="8" fill="' + b + '" opacity=".22"/>' +
          '<rect x="78" y="210" width="90" height="48" rx="6" fill="' + b + '" opacity=".2"/>' +
          '<path d="M360 230 L470 130 L580 230 Z" fill="' + b + '"/>' +
          '<rect x="400" y="230" width="140" height="90" fill="' + b + '"/>' +
          '<rect x="430" y="255" width="36" height="65" fill="#fff"/>' +
          '<rect x="488" y="248" width="28" height="28" fill="#fff"/>' +
          '<rect x="528" y="248" width="28" height="28" fill="#fff"/>' +
          '</svg>';
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }

      function hrefFor(item) {
        if (item.cta === 'phone') return 'tel:' + PHONE_TEL;
        if (item.cta === 'wizard') return WIZARD_URL;
        return ANFRAGE_URL + '?id=' + encodeURIComponent(item.id);
      }

      function render() {
        document.getElementById('grid').innerHTML = items
          .map((item) => {
            const needs = (item.bedarf || [])
              .map((line) => '<li>' + line + '</li>')
              .join('');
            return (
              '<article class="card">' +
              '<div class="top"><div class="icon">' +
              iconSvg(item.icon) +
              '</div><div><h3>' +
              item.titel +
              '</h3><p class="sub">' +
              (item.untertitel || '') +
              '</p></div></div>' +
              '<img class="photo" alt="" src="' +
              picture(item.bild) +
              '"/>' +
              '<ul class="need">' +
              needs +
              '</ul>' +
              (item.preis ? '<div class="price">' + item.preis + '</div>' : '<div class="price"></div>') +
              '<a class="btn" href="' +
              hrefFor(item) +
              '" target="_blank" rel="noopener">Jetzt anfragen</a>' +
              '</article>'
            );
          })
          .join('');
      }

      window.addEventListener('message', (event) => {
        let data = event.data;
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch { return; }
        }
        if (data && data.data) data = data.data;
        if (!data || data.type !== 'LEISTUNGEN' || !Array.isArray(data.items)) return;
        items = data.items;
        render();
      });

      render();
    </script>
  </body>
</html>
