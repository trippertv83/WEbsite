<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Referenzen</title>
    <style>
      :root {
        --blue: #0b78d1;
        --blue-dark: #085ea4;
        --blue-soft: #e7f2fb;
        --panel: #1c222b;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.78);
        --line: rgba(255, 255, 255, 0.28);
        --font: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        font-family: var(--font);
        color: var(--text);
        background: var(--panel);
      }
      .page {
        max-width: 720px;
        margin: 0 auto;
        padding-bottom: 1.4rem;
      }
      .hero {
        position: relative;
        overflow: hidden;
        margin-bottom: 0.35rem;
      }
      .hero img {
        width: 100%;
        height: 230px;
        object-fit: cover;
        display: block;
        background: #2a3038;
      }
      .hero.is-empty img { display: none; }
      .hero.is-empty {
        height: 160px;
        background: linear-gradient(180deg, var(--blue-dark), var(--panel));
      }
      .hero::after {
        content: '';
        position: absolute;
        left: -18%;
        right: -18%;
        bottom: -42px;
        height: 84px;
        background: var(--panel);
        border-radius: 50%;
      }
      .body {
        padding: 0.4rem 1.35rem 0;
        text-align: center;
      }
      h2 {
        margin: 0 0 0.45rem;
        font-size: clamp(1.35rem, 4.2vw, 1.85rem);
        line-height: 1.25;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      h2 .year {
        color: var(--blue);
      }
      .lead {
        margin: 0 auto 1.15rem;
        max-width: 38rem;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.45;
      }
      .specs {
        margin: 0 auto 1.15rem;
        max-width: 28rem;
      }
      .specs div {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.7rem;
        padding: 0.62rem 0;
        border-bottom: 1px solid var(--line);
      }
      .specs dt,
      .specs dd {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.35;
      }
      .specs dt {
        font-weight: 700;
        text-align: right;
      }
      .specs dd { text-align: left; }
      .text {
        margin: 0 auto 1.2rem;
        max-width: 38rem;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
        white-space: pre-wrap;
        text-align: center;
      }
      .text:empty { display: none; }
      .nav {
        display: flex;
        justify-content: center;
        gap: 0.7rem;
      }
      button {
        font: inherit;
        font-weight: 700;
        min-height: 44px;
        min-width: 7.5rem;
        padding: 0 1.2rem;
        border: 0;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        cursor: pointer;
      }
      button:hover { background: var(--blue-dark); }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(11, 120, 209, 0.45);
      }
    </style>
  </head>
  <body>
    <article class="page">
      <div class="hero" id="hero">
        <img id="photo" alt="" />
      </div>
      <div class="body">
        <h2 id="titel"></h2>
        <p class="lead" id="untertitel"></p>
        <dl class="specs" id="specs"></dl>
        <p class="text" id="text"></p>
        <div class="nav">
          <button type="button" id="prev">← Zurück</button>
          <button type="button" id="next">Weiter →</button>
        </div>
      </div>
    </article>
    <script>
      const BASE = 'referenzen/';
      let items = [
        {
          jahr: '2018',
          kategorie: 'Forschung',
          titel: 'Bau von 4 Energiespeicherhäusern',
          untertitel: 'Auszeichnung mit dem Bayerischen Energiepreis 2022',
          baujahr: '2018',
          wohneinheiten: '4',
          kfw: 'KfW 40',
          heizung: 'Sole-Wasser-Wärmepumpe',
          warmwasser: 'Sole-Wasser-Wärmepumpe',
          lueftung: 'Dezentral mit Wärmepumpe',
          pv: 'Ja, mit Speicher',
          text: '',
          bild: BASE + 'herzo.jpg',
        },
        {
          jahr: '2023',
          kategorie: 'Forschung',
          titel: 'FlexiPlus Wohnen Coburg',
          untertitel: 'Ausgezeichnet nachhaltig – mit dem QNG-Siegel',
          baujahr: '2023',
          wohneinheiten: '15',
          kfw: 'KfW 40 mit QNG',
          heizung: 'Fernwärme',
          warmwasser: 'Fernwärme',
          lueftung: 'Dezentral mit Wärmepumpe',
          pv: 'Ja',
          text: 'FlexiPlus ist Teil eines Pilotprojekts für das Qualitätssiegel Nachhaltiges Gebäude (QNG). Das Gebäude wurde nach der Effizienzhaus-Stufe NH 40 umgesetzt.',
          bild: BASE + 'coburg.jpg',
        },
        {
          jahr: '2026',
          kategorie: 'Forschung',
          titel: 'Kleiner Wohnen@Land',
          untertitel: 'Unterstützt durch die Bundesstiftung Bauakademie',
          baujahr: '2026',
          wohneinheiten: '26',
          kfw: 'KfW 55 NiN',
          heizung: 'Luft-Wasser-Wärmepumpe',
          warmwasser: 'Booster-Wärmepumpe',
          lueftung: 'Dezentral mit Wärmepumpe',
          pv: 'Ja',
          text: 'Pilotprojekt „Innovationen im Gebäudebereich“ in Redwitz. Begleitforschung durch das BBSR zur wissenschaftlichen Auswertung der planerischen und baulichen Ansätze.',
          bild: BASE + 'redwitz.jpg',
        },
      ];
      let index = 0;
      const ROWS = [
        ['baujahr', 'Baujahr'],
        ['wohneinheiten', 'Anzahl der Wohnungen'],
        ['kfw', 'KfW-Effizienzhaus'],
        ['heizung', 'Heizung'],
        ['warmwasser', 'Warmwasserversorgung'],
        ['lueftung', 'Lüftung'],
        ['pv', 'PV-Anlage'],
      ];

      const els = {
        hero: document.getElementById('hero'),
        photo: document.getElementById('photo'),
        titel: document.getElementById('titel'),
        untertitel: document.getElementById('untertitel'),
        specs: document.getElementById('specs'),
        text: document.getElementById('text'),
      };

      function show() {
        if (!items.length) return;
        const item = items[index];
        const url = String(item.bild || '').trim();
        if (url) {
          els.photo.src = url;
          els.photo.alt = item.titel || '';
          els.hero.classList.remove('is-empty');
        } else {
          els.photo.removeAttribute('src');
          els.hero.classList.add('is-empty');
        }
        const year = item.jahr || item.baujahr || '';
        const kat = item.kategorie || '';
        const name = item.titel || '';
        els.titel.innerHTML =
          (year ? '<span class="year">' + escapeHtml(year) + '</span> ' : '') +
          escapeHtml([kat, name].filter(Boolean).join(' '));
        els.untertitel.textContent = item.untertitel || '';
        els.untertitel.hidden = !item.untertitel;
        els.specs.innerHTML = ROWS.map(([key, label]) => {
          const value = item[key];
          if (value == null || String(value).trim() === '') return '';
          return '<div><dt>' + escapeHtml(label) + '</dt><dd>' + escapeHtml(String(value)) + '</dd></div>';
        }).join('');
        els.text.textContent = item.text || '';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function go(step) {
        if (!items.length) return;
        index = (index + step + items.length) % items.length;
        show();
      }

      document.getElementById('prev').onclick = () => go(-1);
      document.getElementById('next').onclick = () => go(1);

      function takeMessage(raw) {
        let data = raw;
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch { return; }
        }
        if (data && data.data) data = data.data;
        if (!data || data.type !== 'REFERENZEN' || !Array.isArray(data.items)) return;
        items = data.items.filter((item) => item && item.aktiv !== false);
        index = 0;
        show();
      }

      window.addEventListener('message', (event) => takeMessage(event.data));
      show();
    </script>
  </body>
</html>
